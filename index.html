<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Beyond — songs, written in sound</title>
    <meta
      name="description"
      content="Beyond transcribes songs into the International Phonetic Alphabet, word by word, and lays them across the waveform where they were sung."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06070f" />

    <!-- Installable: a home-screen app opens offline, and its storage is
         durable rather than being swept up as cache after a week unused. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beyond" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Gentium Plus carries the full IPA range, including the length marks and
      r-coloured vowels most UI fonts quietly substitute. Fraunces gives the
      wordmark and lyric line their editorial weight; Inter does the chrome.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Gentium+Plus:ital@0;1&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      The mark, inline, so the tab has it before anything is fetched.

      This declaration comes after the PNG above and therefore wins, which is
      worth knowing: it quietly carried an open-o for months while the app's
      actual icon was something else entirely. One schwa, in the app's own ink
      and mint — the same mark as the home screen, the taskbar and the masthead.
    -->
    <link
      id="favicon"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306070f'/%3E%3Ctext x='16' y='17' font-size='23' text-anchor='middle' dominant-baseline='central' fill='%237cf5d5' font-family='system-ui,sans-serif'%3E%C9%99%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="aurora__band aurora__band--one"></span>
      <span class="aurora__band aurora__band--two"></span>
      <span class="aurora__band aurora__band--three"></span>
    </div>

    <div id="app"></div>

    <noscript>
      <p style="padding: 2rem; color: #c4d6ff; font-family: system-ui">
        Beyond needs JavaScript — the transcription model runs in this page.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
